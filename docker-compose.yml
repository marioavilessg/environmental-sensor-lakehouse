services:
  # ---------------------------------------------------------------------------
  # NAMENODE: El "cerebro" de HDFS.
  # Gestiona los metadatos del sistema de archivos (quÃ© bloques forman quÃ© archivos).
  # ---------------------------------------------------------------------------
  namenode:
    image: apache/hadoop:3.4.0 # Usamos la versiÃ³n oficial de Apache Hadoop
    container_name: namenode
    profiles: ["batch"]
    hostname: namenode
    user: root # Necesario para permisos de escritura en volÃºmenes
    # Comando de inicio personalizado:
    # 1. Copia el entrypoint original a /tmp
    # 2. 'sed': Corrige posibles errores de formato de lÃ­nea de Windows (\r\n) que rompen el script
    # 3. Ejecuta el entrypoint original iniciÃ¡ndolo como 'namenode'
    command: [ "/bin/bash", "-c", "cp /opt/hadoop/scripts/entrypoint.sh /tmp/entrypoint.sh && sed -i 's/\\r$//' /tmp/entrypoint.sh && bash /tmp/entrypoint.sh namenode" ]
    ports:
      - "9870:9870" # Puerto Web UI del NameNode (http://localhost:9870)
    env_file: ./.env # Carga variables de entorno comunes (configuraciÃ³n de Hadoop)
    volumes:
      - namenode_data:/tmp/hadoop-hadoop/dfs/name # PERSISTENCIA: Los metadatos de HDFS se guardan aquÃ­
      # InyecciÃ³n de archivos de configuraciÃ³n (.xml) desde tu carpeta local ./config al contenedor
      - ./configs/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./configs/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./configs/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./configs/hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./scripts:/opt/hadoop/scripts # Scripts auxiliares
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # DATANODE 1: El primer "trabajador" de almacenamiento.
  # Guarda los bloques de datos reales.
  # ---------------------------------------------------------------------------
  datanode1:
    image: apache/hadoop:3.4.0
    container_name: datanode1
    profiles: ["batch"]
    user: root
    command: [ "/bin/bash", "-c", "cp /opt/hadoop/scripts/entrypoint.sh /tmp/entrypoint.sh && sed -i 's/\\r$//' /tmp/entrypoint.sh && bash /tmp/entrypoint.sh datanode" ]
    depends_on:
      - namenode # Espera a que el NameNode arranque primero
    env_file: ./.env
    volumes:
      - datanode1_data:/tmp/hadoop-hadoop/dfs/data # PERSISTENCIA: Datos del nodo 1
      - ./configs/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./configs/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./configs/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./configs/hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./scripts:/opt/hadoop/scripts
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # DATANODE 2: Segundo "trabajador" de almacenamiento.
  # Permite tener replicaciÃ³n de datos (redundancia).
  # ---------------------------------------------------------------------------
  datanode2:
    image: apache/hadoop:3.4.0
    container_name: datanode2
    profiles: ["batch"]
    user: root
    command: [ "/bin/bash", "-c", "cp /opt/hadoop/scripts/entrypoint.sh /tmp/entrypoint.sh && sed -i 's/\\r$//' /tmp/entrypoint.sh && bash /tmp/entrypoint.sh datanode" ]
    depends_on:
      - namenode
    env_file: ./.env
    volumes:
      - datanode2_data:/tmp/hadoop-hadoop/dfs/data # PERSISTENCIA: Datos del nodo 2
      - ./configs/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./configs/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./configs/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./configs/hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./scripts:/opt/hadoop/scripts
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # RESOURCEMANAGER (YARN): El "jefe" de los recursos.
  # Asigna CPU y RAM a las tareas (Jobs) que se ejecutan en el cluster.
  # ---------------------------------------------------------------------------
  resourcemanager:
    image: apache/hadoop:3.4.0
    container_name: resourcemanager
    profiles: ["batch"]
    hostname: resourcemanager
    user: root
    command: [ "/bin/bash", "-c", "cp /opt/hadoop/scripts/entrypoint.sh /tmp/entrypoint.sh && sed -i 's/\\r$//' /tmp/entrypoint.sh && bash /tmp/entrypoint.sh resourcemanager" ]
    ports:
      - "8088:8088" # Puerto Web UI de YARN (http://localhost:8088)
    env_file: ./.env
    volumes:
      - ./configs/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./configs/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./configs/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./configs/hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./scripts:/opt/hadoop/scripts
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # NODEMANAGER (YARN): El "trabajador" de cÃ³mputo.
  # Ejecuta las tareas reales (contenedores de YARN) que le manda el ResourceManager.
  # ---------------------------------------------------------------------------
  nodemanager:
    image: apache/hadoop:3.4.0
    container_name: nodemanager
    profiles: ["batch"]
    user: root
    command: [ "/bin/bash", "-c", "cp /opt/hadoop/scripts/entrypoint.sh /tmp/entrypoint.sh && sed -i 's/\\r$//' /tmp/entrypoint.sh && bash /tmp/entrypoint.sh nodemanager" ]
    depends_on:
      - resourcemanager
      - namenode
    env_file: ./.env
    volumes:
      - ./configs/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./configs/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./configs/hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./configs/hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./scripts:/opt/hadoop/scripts
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # JUPYTERLAB: Tu entorno de trabajo (Cliente).
  # Contiene Python, clientes de HDFS/YARN y es donde escribes cÃ³digo.
  # NO es parte de la arquitectura base de Hadoop, pero lo usamos para interactuar.
  # ---------------------------------------------------------------------------
  jupyter:
    build:
      context: .
      dockerfile: src/jupyter/Dockerfile
    container_name: jupyter-aula
    profiles: ["core"]
    user: root # Necesario para evitar problemas de permisos en Docker Desktop/Windows
    environment:
      - GRANT_SUDO=yes
      - CHOWN_HOME=yes
      - CHOWN_EXTRA=/home/jovyan/.local/share/jupyter
      # Apuntar a configuraciÃ³n de Hadoop para que Spark sepa donde estÃ¡ el NameNode
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    command: start-notebook.sh --IdentityProvider.token=''
    ports:
      - "8888:8888" # Puerto de acceso a Jupyter (http://localhost:8888)
    env_file: ./.env
    volumes:
      - ./:/home/jovyan/work # Mapea carpeta actual a 'work' en Jupyter
      # Montamos configuraciÃ³n de Hadoop en solo lectura para que Spark la lea
      - ./configs/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./configs/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      # NO montamos binarios de hadoop porque son incompatibles
      - jupyter_data:/home/jovyan/.local/share/jupyter
    deploy:
      resources:
        limits:
          memory: 2G # Aumentamos memoria para Jupyter+Spark

  iot-ingestor:
    image: python:3.11-slim
    container_name: iot-ingestor
    profiles: ["core"]
    working_dir: /app
    environment:
      - PROJECT_ROOT=/app
      - IOT_RECEIVER_HOST=0.0.0.0
      - IOT_RECEIVER_PORT=5050
    command: python src/jobs/ingestion/iot_http_receiver.py
    ports:
      - "5050:5050"
    volumes:
      - ./src:/app/src
      - ./data/iot:/app/data/iot
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================================
  # ðŸ“Š UT4: MONITORIZACIÃ“N Y OBSERVABILIDAD (Prometheus, Grafana, Exporters)
  # ===========================================================================
  postgres:
    image: postgres:13
    container_name: airflow-postgres
    profiles: ["core"]
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  airflow-init:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-init
    profiles: ["orchestration"]
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    command: version
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./src/airflow/logs:/opt/airflow/logs
      - ./src/airflow/plugins:/opt/airflow/plugins
    # Script para inicializar la BD y crear el usuario admin:admin si es la primera vez
    entrypoint: >
      bash -c " airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-webserver
    profiles: ["orchestration"]
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8081:8080" # Usamos 8081 porque 8080 podrÃ­a ocuparlo cAdvisor o YARN en algunos host
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./src/airflow/logs:/opt/airflow/logs
      - ./src/airflow/plugins:/opt/airflow/plugins
    command: webserver
    deploy:
      resources:
        limits:
          memory: 512M

  airflow-scheduler:
    build:
      context: .
      dockerfile: src/airflow/Dockerfile
    container_name: airflow-scheduler
    user: root
    profiles: ["orchestration"]
    depends_on:
      - postgres
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags
      - ./src/airflow/logs:/opt/airflow/logs
      - ./src/airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  # ðŸª£ DATA LAKE MODERNO: MinIO (Compatible con Amazon S3)
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: minio
    profiles: ["core"]
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Web UI Console
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=adminadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 256M

  minio-init:
    image: minio/mc
    container_name: minio-init
    profiles: ["core"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 admin adminadmin;
      mc mb myminio/datalake || true;
      mc anonymous set public myminio/datalake || true;
      exit 0;
      "

  # ===========================================================================
  # ðŸ“ˆ UT5: BUSINESS INTELLIGENCE (Apache Superset)
  # ===========================================================================
  superset:
    build:
      context: .
      dockerfile: src/superset/Dockerfile
    container_name: superset
    profiles: ["bi"]
    depends_on:
      - postgres
    ports:
      - "8089:8088"
    environment:
      - SUPERSET_SECRET_KEY=mi_secreto_educativo_super_seguro
    command: >
      bash -c "
      echo \"SQLALCHEMY_DATABASE_URI = 'postgresql+psycopg2://airflow:airflow@postgres/superset'\" > /app/pythonpath/superset_config.py &&
      echo \"SUPERSET_SECRET_KEY = 'mi_secreto_educativo_super_seguro'\" >> /app/pythonpath/superset_config.py &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@localhost --password admin || true &&
      superset init &&
      /usr/bin/run-server.sh"
    deploy:
      resources:
        limits:
          memory: 800M

# ---------------------------------------------------------------------------
# VOLÃšMENES: Espacios de almacenamiento gestionados por Docker.
# Sobreviven aunque borres los contenedores (docker down).
# ---------------------------------------------------------------------------
volumes:
  namenode_data: # Metadatos del NameNode
  datanode1_data: # Datos del DataNode 1
  datanode2_data: # Datos del DataNode 2
  jupyter_data:
  postgres_data: # UT4: Base de datos de metadatos de Airflow
  minio_data: # Persistencia del Data Lake S3
